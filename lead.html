<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Manrope', sans-serif;
            background-color: #0f172a; /* Темний сучасний фон */
            color: #f8fafc;
        }
        .glass-container {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 32px;
        }
        .input-field {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .input-field:focus {
            border-color: #8b5cf6;
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.3);
            outline: none;
        }
        .role-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.2s;
        }
        .role-card:active { transform: scale(0.97); }
        .role-card.active-role {
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.2), rgba(37, 99, 235, 0.2));
            border-color: #8b5cf6;
        }
        .shimmer {
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            background-size: 200% 100%;
            animation: shimmer 2s infinite;
        }
        @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
        .loader { border-top-color: transparent; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4">

    <div class="mt-8 mb-8 text-center">
        <h1 class="text-4xl font-extrabold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-violet-400 to-blue-400">
            KarierOK
        </h1>
        <p class="text-slate-400 text-sm font-medium mt-1 uppercase tracking-widest">Premium HR System</p>
    </div>

    <div class="glass-container w-full max-w-md p-6 shadow-2xl relative overflow-hidden">
        <div id="step1">
            <h2 class="text-xl font-semibold mb-6 text-center">Хто ви сьогодні?</h2>
            <div class="grid gap-4">
                <div onclick="setRole('recruiter')" class="role-card p-5 rounded-2xl cursor-pointer flex items-center space-x-4">
                    <div class="p-3 bg-blue-500/20 text-blue-400 rounded-xl"><i data-lucide="search"></i></div>
                    <div><b class="block">Рекрутер</b><span class="text-xs text-slate-500">Шукаю спеціалістів</span></div>
                </div>
                <div onclick="setRole('candidate')" class="role-card p-5 rounded-2xl cursor-pointer flex items-center space-x-4">
                    <div class="p-3 bg-emerald-500/20 text-emerald-400 rounded-xl"><i data-lucide="user"></i></div>
                    <div><b class="block">Кандидат</b><span class="text-xs text-slate-500">Шукаю нові виклики</span></div>
                </div>
                <div onclick="setRole('client')" class="role-card p-5 rounded-2xl cursor-pointer flex items-center space-x-4">
                    <div class="p-3 bg-amber-500/20 text-amber-400 rounded-xl"><i data-lucide="zap"></i></div>
                    <div><b class="block">Замовник</b><span class="text-xs text-slate-500">Потрібна команда</span></div>
                </div>
            </div>
        </div>

        <form id="mainForm" class="hidden space-y-5">
            <input type="hidden" name="role" id="roleInput">
            
            <div id="dynamicFields" class="space-y-4"></div>

            <button type="button" id="submitBtn" onclick="sendData()" class="w-full bg-gradient-to-r from-violet-600 to-blue-600 py-4 rounded-2xl font-bold text-lg shadow-lg hover:shadow-violet-500/20 transition-all flex items-center justify-center space-x-2">
                <span>Надіслати заявку</span>
                <i data-lucide="arrow-right" class="w-5 h-5"></i>
            </button>
            
            <button type="button" onclick="location.reload()" class="w-full text-slate-500 text-sm font-medium py-2">
                Повернутись назад
            </button>
        </form>

        <div id="success" class="hidden py-10 text-center space-y-4">
            <div class="w-20 h-20 bg-emerald-500/20 text-emerald-400 rounded-full flex items-center justify-center mx-auto mb-4 border border-emerald-500/30">
                <i data-lucide="check-circle-2" class="w-12 h-12"></i>
            </div>
            <h2 class="text-2xl font-bold text-white">Успішно!</h2>
            <p class="text-slate-400">Ми отримали ваші дані. Наш менеджер зв'яжеться з вами найближчим часом.</p>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        lucide.createIcons();

        function setRole(role) {
            tg.HapticFeedback.impactOccurred('medium');
            document.getElementById('step1').classList.add('hidden');
            const form = document.getElementById('mainForm');
            const fields = document.getElementById('dynamicFields');
            document.getElementById('roleInput').value = role;
            form.classList.remove('hidden');

            let html = '';
            if(role === 'recruiter') {
                html = `
                    <input type="text" name="name" placeholder="Ваше ім'я" class="input-field w-full p-4 rounded-xl text-white" required>
                    <input type="text" name="tgNick" placeholder="Telegram @username" class="input-field w-full p-4 rounded-xl text-white" required>
                    <textarea name="comment" placeholder="Додаткова інформація" class="input-field w-full p-4 rounded-xl text-white h-32"></textarea>
                `;
            } else if(role === 'candidate') {
                html = `
                    <input type="text" name="inviter" placeholder="Хто вас запросив?" class="input-field w-full p-4 rounded-xl text-white">
                    <input type="text" name="vacancy" placeholder="На яку вакансію?" class="input-field w-full p-4 rounded-xl text-white" required>
                    <input type="text" name="contacts" placeholder="Ваш телефон або email" class="input-field w-full p-4 rounded-xl text-white" required>
                `;
            } else if(role === 'client') {
                html = `
                    <input type="text" name="company" placeholder="Назва вашої компанії" class="input-field w-full p-4 rounded-xl text-white" required>
                    <input type="text" name="clientName" placeholder="Як вас звати?" class="input-field w-full p-4 rounded-xl text-white" required>
                    <input type="text" name="contacts" placeholder="Контакти для зв'язку" class="input-field w-full p-4 rounded-xl text-white" required>
                    <div class="bg-slate-800/50 p-5 rounded-2xl border border-white/5">
                        <label class="text-xs font-bold text-slate-400 uppercase">Кількість вакансій</label>
                        <input type="number" id="vCount" name="vacancies" value="1" min="1" oninput="calc()" class="w-full bg-transparent text-2xl font-bold text-violet-400 mt-2 outline-none">
                        <div class="flex justify-between items-center mt-4 pt-4 border-t border-white/5">
                            <span class="text-sm">Бюджет подбору:</span>
                            <span id="price" class="text-xl font-black text-white">4000 грн</span>
                        </div>
                    </div>
                `;
            }
            fields.innerHTML = html;
        }

        function calc() {
            const v = document.getElementById('vCount').value;
            let p = 8000;
            if (v == 1) p = 4000;
            if (v == 2) p = 6000;
            document.getElementById('price').innerText = p + " грн";
            tg.HapticFeedback.selectionChanged();
        }

        function sendData() {
            const btn = document.getElementById('submitBtn');
            const form = document.getElementById('mainForm');
            const formData = Object.fromEntries(new FormData(form).entries());

            // Перевірка на заповненість
            if(!formData.name && !formData.clientName && !formData.vacancy) {
                tg.HapticFeedback.notificationOccurred('error');
                return alert('Будь ласка, заповніть обов\'язкові поля');
            }

            btn.disabled = true;
            btn.innerHTML = '<div class="loader w-6 h-6 border-2 border-white rounded-full"></div>';
            tg.HapticFeedback.impactOccurred('heavy');

            google.script.run.withSuccessHandler(() => {
                tg.HapticFeedback.notificationOccurred('success');
                form.classList.add('hidden');
                document.getElementById('success').classList.remove('hidden');
            }).processForm(formData);
        }
    </script>
</body>
</html>
