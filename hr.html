<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>KarierOK | Cloud CRM</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        [x-cloak] { display: none !important; }
        body { background-color: #0b0f1a; color: #e2e8f0; height: 100vh; overflow: hidden; font-family: 'Inter', sans-serif; }
        .card-glass { background: rgba(30, 41, 59, 0.5); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
        input, select, textarea { background: rgba(0, 0, 0, 0.3) !important; border: 1px solid rgba(255, 255, 255, 0.1) !important; color: white !important; outline: none !important; }
        .dataTables_wrapper { color: #cbd5e1 !important; }
        table.dataTable thead th { font-size: 10px; text-transform: uppercase; color: #64748b; border-bottom: 1px solid rgba(255,255,255,0.1) !important; }
        table.dataTable tbody td { border-bottom: 1px solid rgba(255,255,255,0.05) !important; padding: 10px !important; }
        .dataTables_filter input { border-radius: 8px !important; padding: 4px 10px !important; margin-bottom: 10px; }
    </style>
</head>
<body x-data="mainSystem()" x-init="init()">

    <template x-if="!isLoggedIn">
        <div class="fixed inset-0 flex items-center justify-center bg-[#0b0f1a] z-[100]">
            <div class="card-glass p-10 rounded-[2.5rem] w-full max-w-md shadow-2xl text-center">
                <h1 class="text-3xl font-bold mb-2 italic">KarierOK</h1>
                <p class="text-slate-500 text-xs mb-8 uppercase tracking-[0.3em]">Cloud System</p>
                <input type="text" x-model="loginName" placeholder="Ваше Имя" class="w-full px-5 py-4 rounded-2xl mb-4">
                <button @click="handleLogin()" class="w-full py-4 bg-indigo-600 hover:bg-indigo-500 rounded-2xl font-bold text-white transition-all uppercase text-xs tracking-widest">
                    Войти
                </button>
            </div>
        </div>
    </template>

    <template x-if="isLoggedIn">
        <div class="flex flex-col h-full p-4 md:p-6 gap-6" x-cloak>
            <header class="flex justify-between items-center shrink-0 card-glass p-4 rounded-2xl">
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center"><i data-lucide="cloud" class="text-white w-5 h-5"></i></div>
                    <div>
                        <h1 class="text-xl font-bold italic">KarierOK</h1>
                        <p class="text-[10px] text-slate-500">Рекрутер: <span class="text-emerald-400 font-bold" x-text="currentUser"></span></p>
                    </div>
                </div>
                <div class="flex gap-2">
                    <button @click="syncWithCloud()" class="bg-indigo-600 hover:bg-indigo-500 px-6 py-2 rounded-xl text-xs font-bold shadow-lg shadow-indigo-600/30">СИНХРОНИЗИРОВАТЬ</button>
                    <button @click="logout()" class="p-2 bg-red-500/10 hover:bg-red-500/20 rounded-lg text-red-400"><i data-lucide="log-out" class="w-5 h-5"></i></button>
                </div>
            </header>

            <main class="flex-1 grid lg:grid-cols-12 gap-6 min-h-0">
                <div class="lg:col-span-3 flex flex-col gap-6">
                    <div class="card-glass p-5 rounded-3xl flex-1 flex flex-col">
                        <h3 class="text-[10px] font-bold mb-4 text-emerald-400 uppercase tracking-widest">Задачи</h3>
                        <input type="text" x-model="newTask" @keydown.enter="addTask()" placeholder="+" class="w-full text-xs px-3 py-2 rounded-xl mb-4">
                        <div class="flex-1 overflow-y-auto space-y-2">
                            <template x-for="(t, i) in tasks" :key="i">
                                <div class="flex items-center justify-between bg-black/20 p-2 rounded-xl border border-white/5">
                                    <span :class="t.done ? 'line-through text-slate-600' : ''" class="text-[11px] cursor-pointer" @click="t.done = !t.done; saveLocal()" x-text="t.text"></span>
                                    <button @click="tasks.splice(i, 1); saveLocal()" class="text-red-500/20 hover:text-red-500"><i data-lucide="x" class="w-3 h-3"></i></button>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>

                <div class="lg:col-span-9 flex flex-col min-h-0">
                    <div class="card-glass rounded-[2rem] flex flex-col flex-1 p-6 overflow-hidden">
                        <div class="flex justify-between items-center mb-6">
                            <h2 class="text-xl font-bold italic">База кандидатов</h2>
                            <button @click="openModal()" class="bg-indigo-600 px-6 py-3 rounded-2xl text-[10px] font-bold uppercase tracking-widest">+ Добавить</button>
                        </div>
                        <div class="flex-1 min-h-0 overflow-hidden">
                            <table id="hrDataTable" class="display w-full"></table>
                        </div>
                    </div>
                </div>
            </main>

            <div x-show="showModal" x-cloak class="fixed inset-0 z-[110] flex items-center justify-center p-4 bg-black/90 backdrop-blur-md">
                <div @click.away="showModal = false" class="card-glass w-full max-w-lg p-8 rounded-[2.5rem]">
                    <h2 class="text-2xl font-bold mb-6 italic" x-text="editIndex === null ? 'Новый' : 'Изменить'"></h2>
                    <div class="grid grid-cols-2 gap-4">
                        <input type="text" x-model="form.name" class="col-span-2 px-4 py-3 rounded-2xl text-sm" placeholder="ФИО">
                        <input type="text" x-model="form.pos" class="px-4 py-3 rounded-2xl text-sm" placeholder="Вакансия">
                        <select x-model="form.stage" class="px-4 py-3 rounded-2xl text-sm">
                            <option>Новый</option>
                            <option>Интервью</option>
                            <option>Тестовое</option>
                            <option>Оффер</option>
                            <option>Отказ</option>
                        </select>
                        <input type="text" x-model="form.link" class="col-span-2 px-4 py-3 rounded-2xl text-sm" placeholder="Telegram @">
                        <textarea x-model="form.info" class="col-span-2 px-4 py-3 rounded-2xl text-sm h-24" placeholder="Заметки..."></textarea>
                    </div>
                    <div class="flex gap-4 mt-8">
                        <button @click="showModal = false" class="flex-1 py-4 bg-white/5 rounded-2xl text-[10px] font-bold uppercase">Отмена</button>
                        <button @click="saveCandidate()" class="flex-1 py-4 bg-indigo-600 rounded-2xl text-[10px] font-bold uppercase">Сохранить</button>
                    </div>
                </div>
            </div>
        </div>
    </template>

<script>
function mainSystem() {
    return {
        // ССЫЛКА НА ТВОЙ GOOGLE SCRIPT
        cloudUrl: 'https://script.google.com/macros/s/AKfycbxx9WgzvotwP1dUk5iSSVrDdWmYONbkjLEOQY-hD_2IUuXz-9JAAi3rJRIrYab1-6_p/exec',
        isLoggedIn: false,
        currentUser: '',
        loginName: '',
        showModal: false,
        editIndex: null,
        notes: '',
        newTask: '',
        tasks: [],
        form: { name: '', pos: '', stage: 'Новый', link: '', info: '', author: '' },
        vacancies: [],

        init() {
            lucide.createIcons();
            const savedUser = localStorage.getItem('loggedUser');
            if (savedUser) {
                this.currentUser = savedUser;
                this.isLoggedIn = true;
                this.loadLocal();
                this.$nextTick(() => { this.renderTable(); });
            }
        },

        handleLogin() {
            if (!this.loginName.trim()) return alert('Имя!');
            this.currentUser = this.loginName;
            localStorage.setItem('loggedUser', this.loginName);
            this.isLoggedIn = true;
            this.loadLocal();
            this.$nextTick(() => { this.renderTable(); lucide.createIcons(); });
        },

        logout() { localStorage.removeItem('loggedUser'); location.reload(); },

        renderTable() {
            if ($.fn.DataTable.isDataTable('#hrDataTable')) { $('#hrDataTable').DataTable().destroy(); }
            $('#hrDataTable').DataTable({
                data: this.vacancies,
                columns: [
                    { data: 'name', title: 'Кандидат', className: 'font-bold text-white' },
                    { data: 'pos', title: 'Вакансия' },
                    { data: 'stage', title: 'Этап' },
                    { data: 'link', title: 'Контакт', className: 'text-indigo-400' },
                    { data: 'author', title: 'Автор' },
                    {
                        data: null,
                        render: (data, type, row, meta) => `
                            <div class="flex gap-3">
                                <i data-lucide="edit-3" class="w-4 h-4 text-indigo-400 cursor-pointer" onclick="editRow(${meta.row})"></i>
                                <i data-lucide="trash-2" class="w-4 h-4 text-red-500 cursor-pointer" onclick="deleteRow(${meta.row})"></i>
                            </div>`
                    }
                ],
                drawCallback: () => lucide.createIcons(),
                dom: 'ftip',
                pageLength: 9
            });
            window.editRow = (i) => this.openModal(i);
            window.deleteRow = (i) => { if(confirm('Удалить?')) { this.vacancies.splice(i, 1); this.renderTable(); this.saveLocal(); } };
        },

        openModal(i = null) {
            this.editIndex = i;
            this.form = (i !== null) ? { ...this.vacancies[i] } : { name: '', pos: '', stage: 'Новый', link: '', info: '', author: this.currentUser };
            this.showModal = true;
        },

        saveCandidate() {
            if (!this.form.name) return;
            if (this.editIndex !== null) this.vacancies[this.editIndex] = { ...this.form };
            else this.vacancies.push({ ...this.form });
            this.renderTable(); this.saveLocal(); this.showModal = false;
        },

        addTask() {
            if (!this.newTask.trim()) return;
            this.tasks.unshift({ text: this.newTask, done: false });
            this.newTask = ''; this.saveLocal();
            this.$nextTick(() => lucide.createIcons());
        },

        saveLocal() {
            localStorage.setItem('karierok_crm_cloud', JSON.stringify({ notes: this.notes, tasks: this.tasks, vacancies: this.vacancies }));
        },

        loadLocal() {
            const saved = localStorage.getItem('karierok_crm_cloud');
            if (saved) {
                const p = JSON.parse(saved);
                this.notes = p.notes || '';
                this.tasks = p.tasks || [];
                this.vacancies = p.vacancies || [];
            }
        },

        syncWithCloud() {
            fetch(this.cloudUrl, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify(this.vacancies)
            }).then(() => alert('Синхронизировано с Google Sheets!'))
              .catch(e => alert('Ошибка: ' + e));
        }
    }
}
</script>
</body>
</html>
